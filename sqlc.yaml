# sqlc configuration.
#
# sqlc generates type-safe Go database access code from SQL queries. In Phase 2
# queries are written under internal/db/queries and `sqlc generate` emits code
# to internal/db/sqlcgen. The feature packages then depend on the generated
# Querier interface for all PostgreSQL access.
#
# Install sqlc: https://docs.sqlc.dev/en/stable/overview/install.html
# Generate:    `make sqlc` or `sqlc generate`
version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
